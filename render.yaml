services:
  - type: web
    name: suarakita-backend
    runtime: node
    plan: starter
    region: singapore
    rootDir: suarakita-backend
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    disk:
      name: suarakita-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_PATH
        value: /var/data/suarakita.sqlite
      - key: UPLOAD_DIR
        value: /var/data/uploads
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CLIENT_ORIGIN
        value: https://ifs24014-pabwe2026-proyek1.vercel.app
      - key: SEED_DEMO_ACCOUNTS
        value: "false"
